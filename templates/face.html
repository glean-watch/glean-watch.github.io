<nav class="crumb" aria-label="Breadcrumb"><a href="/">Faces</a> › <span aria-current="page">$name</span></nav>
<section class="face-head">
  $icon
  <div class="face-id">
    <h1>$name</h1>
    $subtitle
    <p class="cat">$category</p>
  </div>
  <a class="store" href="$store_url">Get it on the Connect IQ Store</a>
</section>
<section class="gallery" aria-roledescription="carousel" aria-label="Pictures of $name">
  <div class="stage">
    <ul class="slides" role="list">
$slides
    </ul>
    <button class="arrow prev" type="button" aria-label="Previous picture" hidden>‹</button>
    <button class="arrow next" type="button" aria-label="Next picture" hidden>›</button>
    <span class="count" hidden>1 / $count</span>
  </div>
  <p class="caption" aria-live="polite">$caption</p>
  <ol class="thumbs" role="list">
$thumbs
  </ol>
</section>
<section class="face-text">
  <p class="lead">$short</p>
$full
  <h2>Settings</h2>
  <table class="settings">
$settings
  </table>
  <p class="works"><a href="/help/#watches">Works on $watch_count watches</a></p>
</section>
