<nav class="crumb" aria-label="Breadcrumb"><a href="/">Faces</a> › <span aria-current="page">$name</span></nav>
<section class="face-head">
  $icon
  <div class="face-id">
    <h1>$name</h1>
    $subtitle
    <p class="cat">$category</p>
  </div>
  <a class="store" href="$store_url">Get it on the Connect IQ Store</a>
</section>
<ul class="strip" role="list" aria-label="Pictures of $name">
$strip
</ul>
<section class="face-text">
  <p class="lead">$short</p>
$full
  <h2>Settings</h2>
  <table class="settings">
$settings
  </table>
  <p class="works"><a href="/help/#watches">Works on $watch_count watches</a></p>
</section>
